<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" role="img" aria-label="telegram-local-bridge logo">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37aee2"/>
      <stop offset="100%" stop-color="#1e88c5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="160" fill="url(#bg)" rx="14"/>

  <!-- Telegram paper plane -->
  <g transform="translate(40, 50)">
    <path d="M 0 30 L 70 0 L 60 60 L 35 42 Z" fill="url(#tg)"/>
    <circle cx="22" cy="48" r="4" fill="#0f172a"/>
  </g>

  <!-- Lock -->
  <g transform="translate(135, 55)" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="18" width="38" height="32" rx="4"/>
    <path d="M 8 18 V 10 a 11 11 0 0 1 22 0 V 18"/>
    <circle cx="19" cy="34" r="3" fill="#10b981"/>
  </g>

  <!-- Terminal -->
  <g transform="translate(200, 60)" stroke="#f59e0b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="80" height="50" rx="5"/>
    <path d="M 10 16 L 22 26 L 10 36"/>
    <line x1="28" y1="38" x2="52" y2="38"/>
  </g>

  <!-- arrow -->
  <g transform="translate(295, 78)" stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="0" y1="0" x2="25" y2="0" stroke-dasharray="4,4"/>
    <path d="M 22 -5 L 30 0 L 22 5"/>
  </g>

  <!-- Phone -->
  <g transform="translate(335, 35)" stroke="#a78bfa" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="55" height="95" rx="8"/>
    <line x1="18" y1="80" x2="37" y2="80"/>
    <line x1="10" y1="14" x2="45" y2="14"/>
    <text x="14" y="34" font-family="monospace" font-size="11" fill="#a78bfa" stroke="none">/read</text>
    <text x="10" y="50" font-family="monospace" font-size="9" fill="#94a3b8" stroke="none">.env</text>
    <text x="12" y="65" font-family="monospace" font-size="9" fill="#f87171" stroke="none">deny</text>
  </g>

  <!-- Title -->
  <text x="40" y="132" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#e2e8f0">
    telegram-local-bridge
  </text>
  <text x="40" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
    safe local-process control via Telegram
  </text>
</svg>